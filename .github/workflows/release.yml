name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: test -s "notes/$GITHUB_REF_NAME.md" || { echo "Write notes/$GITHUB_REF_NAME.md first"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest
      - run: pip install pyinstaller pillow certifi
      - run: python tools/build.py
      - run: ditto -c -k --keepParent "dist/English Coach.app" EnglishCoach-macOS.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: EnglishCoach-macOS.zip
          body_path: notes/${{ github.ref_name }}.md
